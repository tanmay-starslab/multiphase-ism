name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python & JS Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install --upgrade pip pytest numpy scipy pillow h5py
      - name: Run Python unit tests
        run: python -m pytest tests/test_ism_ingest.py -v
      - name: Run JS static & unit contract suite
        run: |
          node tests/js/ui_static.mjs docs/ism
          node tests/js/galaxies_unit.mjs
          node tests/js/fit_unit.mjs
          node tests/js/fit_voigt.mjs
          node tests/js/fit_decode.mjs
          node tests/js/fit_degrade.mjs
          node tests/js/lod_policy.mjs
          node tests/js/colormaps.mjs
          node tests/js/tf_unit.mjs
          node tests/js/vel3d_unit.mjs
          node tests/js/picker_math.mjs
          node tests/js/search_unit.mjs
          node tests/js/features_unit.mjs
          node tests/js/vizdata_unit.mjs
          node tests/js/vizload_unit.mjs
          node tests/js/tier_unit.mjs
          node tests/js/tips_unit.mjs
          node tests/js/uisound_unit.mjs
          node tests/js/smooth_cube.mjs
